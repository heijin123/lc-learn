    { name = "heijin123", email = "licchao7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dashscope>=1.26.7",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
